name: Testes automatizados - Cypress

On:
  pull_request:
    branches:
      -main

jobs: 
  testes: 
    runs-on: ubuntu-latest

steps: 
  - name: Baixar código do repositório
    uses: actions/checkout@v7
    with:
      node-version: '24'
  - name: Instalar dependências
    run: npm ci
  - name: Executar testes Cypress
    run: npx cypress run